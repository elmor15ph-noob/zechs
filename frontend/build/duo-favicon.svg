<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0f1620" rx="24"/>

  <!-- DUO: Two interconnected circles (dual nodes) -->
  <!-- Left circle (Cyan) -->
  <circle cx="38" cy="64" r="24" fill="none" stroke="#00d4ff" stroke-width="3"/>

  <!-- Right circle (Orange) -->
  <circle cx="90" cy="64" r="24" fill="none" stroke="#ff6b35" stroke-width="3"/>

  <!-- Connecting line (represents orchestration/unity) -->
  <line x1="62" y1="64" x2="66" y2="64" stroke="#00d4ff" stroke-width="2.5" opacity="0.8"/>

  <!-- Center dot (unity point) -->
  <circle cx="64" cy="64" r="4" fill="#ff6b35"/>
</svg>
